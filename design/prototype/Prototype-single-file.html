<!DOCTYPE html>
<!--
  دستیار پشتیبانی مشتری — پروتوتایپ کلیک‌پذیر (نسخهٔ تک‌فایل)
  Single-file bundle of the clickable prototype. Fictional demo data.
  STRUCTURE (for readers / AI tools):
  - The viewer (header + left nav + stage) is at the top. Nav groups: customer (mobile/desktop chat), admin panel, store management panel.
  - Every screen is a full HTML document stored below in <script type="text/html" id="s-SCREEN_NAME"> blocks
    (inside them "<\/script" stands for a closing script tag).
  - Each screen's RULES array maps visible button/label text -> target screen; MODALS maps dialog buttons -> targets.
  - Screen names starting with W*/SW* are dialogs shown on top of a base screen.
-->
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار پشتیبانی — پروتوتایپ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef3f2;--fg:#142624;--muted:#4f6260;--card:#fff;--border:#d3dcda;--pri:#0f766e;--sec:#e7f4f1;--deep:#0b3b38}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--fg);background:var(--bg);display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--deep);color:#e6f2ef}
header b{font-size:15px}header small{color:#9cc9c1;font-size:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.08);margin-inline-start:12px}
.seg button{min-height:36px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:#e6f2ef;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--deep);font-weight:600}
.hint{margin-inline-start:auto;font-size:12px;color:#9cc9c1}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:0}
nav{overflow:auto;padding:16px 12px;background:var(--card);border-inline-end:1px solid var(--border)}
nav h2{margin:4px 8px 10px;font-size:13px;color:var(--muted);font-weight:500}
nav button{display:block;width:100%;text-align:start;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
nav button:hover{background:var(--bg)}nav button[aria-current=true]{background:var(--sec);color:#0b3b38;font-weight:600}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;border-radius:36px;background:#0b1514;padding:10px;box-shadow:0 20px 50px rgba(11,59,56,.25)}
.phone iframe{width:100%;height:100%;border:0;border-radius:28px;background:#fff}
.desk{width:1440px;height:900px;transform-origin:center center;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(11,59,56,.2);background:#fff}
.desk iframe{width:100%;height:100%;border:0}
*{scrollbar-width:thin;scrollbar-color:#0f766e transparent}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#0f766e;border-radius:999px}::-webkit-scrollbar-button{display:none}
.dev{display:flex;gap:4px;margin-inline-start:8px}.dev[hidden]{display:none}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.tb{min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:9px;background:transparent;color:#e6f2ef;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb[aria-pressed=true]{background:#f2a33a;border-color:#f2a33a;color:#0b3b38;font-weight:600}
.tb:disabled{opacity:.45;cursor:default}
.simw{display:flex;align-items:center;gap:6px;font-size:12px;color:#9cc9c1}.simw[hidden]{display:none}
.simw select{min-height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:#0b3b38;color:#e6f2ef;font:inherit;font-size:13px;padding:0 8px}
.simw select.on{background:#f2a33a;color:#0b3b38;border-color:#f2a33a;font-weight:600}
nav h3{margin:16px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
nav .note{margin:16px 8px 0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:12px;line-height:20px;color:var(--muted)}
</style></head><body>
<header><div><b>دستیار پشتیبانی — پروتوتایپ</b><br><small>نسخه نمایشی · داده ساختگی</small></div>
<div class="seg" role="group" aria-label="ورودی"><button data-a="customer" aria-pressed="true">مشتری</button><button data-a="admin" aria-pressed="false">ادمین</button><button data-a="store" aria-pressed="false">فروشگاه</button></div>
<div class="seg dev" id="dev" role="group" aria-label="دستگاه"><button data-d="m" aria-pressed="true">موبایل</button><button data-d="d" aria-pressed="false">دسکتاپ</button></div>
<div class="tools"><label class="simw" id="simw">شبیه‌سازی پیام بعدی<select id="sim" title="فقط برای آزمون؛ بخشی از محصول نیست"><option value="normal">عادی</option><option value="sendfail">ارسال پیام شکست بخورد</option><option value="error">سرویس دستیار در دسترس نباشد</option><option value="regfail">ثبت درخواست شکست بخورد</option></select></label><button class="tb" id="back" disabled>→ بازگشت</button><button class="tb" id="restart">شروع دوباره</button><button class="tb" id="hl" aria-pressed="false">نمایش نقاط کلیک‌پذیر</button></div></header>
<div class="wrap"><nav id="nav"></nav><div class="stage" id="stage"></div></div>
<script>function tap(b,f){var t=0;b.addEventListener("pointerdown",function(e){if(e.button)return;t=Date.now();f()});b.addEventListener("click",function(){if(Date.now()-t>600)f()})}

var G={"customer": ["مشتری", "صفحه گفت‌وگو", [["#", "مسیرهای اصلی"], ["Chat-Live?s=welcome", "ح۱ شروع گفت‌وگو"], ["Chat-Live?s=clarify", "ح۴ موجودی — رفع ابهام"], ["Chat-Live?s=partial", "ح۴ب انتخاب ناقص سایز/رنگ"], ["Chat-Live?s=answer", "ح۳ پاسخ و تأیید حل"], ["Chat-Live?s=closed", "ح۸ «بله، ممنون»"], ["Chat-Live?s=notyet", "ح۳ب «نه، هنوز نه»"], ["Chat-Live?s=shipping", "ح۱۳ هزینه و زمان ارسال"], ["Chat-Live?s=order", "ح۱۴ پیگیری سفارش"], ["Chat-Live?s=ret", "ح۱۵ مرجوعی کالا"], ["#", "ارجاع به پشتیبان"], ["Chat-Live?s=registered", "ح۶ درخواست ثبت شد"], ["Chat-Live?s=human", "ح۷ پشتیبان در گفت‌وگو"], ["#", "خطاها و حالت‌های مرزی"], ["Chat-Live?s=error", "ح۹ خطای سرویس"], ["Chat-Live?s=regfail", "ح۱۰ شکست ثبت"], ["Chat-Live?s=sendfail", "ح۱۱ ارسال نشد"], ["Chat-Live?s=toolong", "ح۱۲ پیام بلند"]]], "admin": ["ادمین", "پنل ادمین", [["Login-Admin", "ورود"], ["Main", "صف اقدام"], ["Queue-Stopped", "صف — پاسخ خودکار متوقف"], ["Queue-Empty", "صف خالی"], ["Conversation-Queue", "مکالمه — نمای صف"], ["Conversation", "مکالمه — نمای مالک"], ["Conversation-Observer", "مکالمه — نمای ناظر"], ["Conversation-Closed", "مکالمه — بسته"], ["Bots", "گفت‌وگوهای دستیار"], ["Bots-Sample", "نمونه ۱۰تایی بازبینی"], ["Conversation-Bot", "مکالمه — نمای دستیار"], ["Conversation-Bot?modal=W1-Takeover", "W1 تحویل از دستیار"], ["Conversation?modal=W2-Resolve", "W2 بستن مستند"], ["Conversation?modal=W3-CloseUnconfirmed", "W3 بستن بدون تأیید"], ["Main?modal=W4-Stop", "W4 توقف پاسخ خودکار"], ["Conversation?modal=W5-Handback", "W5 واگذاری"]]], "store": ["فروشگاه", "پنل مدیریت فروشگاه", [["Login-Store", "ورود"], ["Store-Discrepancies", "مغایرت‌ها"], ["Store-FixInventory", "اصلاح موجودی"], ["Store-FixConflict", "اطلاعات متعارض"], ["Store-Products", "محصولات و گونه‌ها"], ["Store-ProductEdit", "ویرایش محصول"], ["Store-Knowledge", "دانش و سیاست"], ["Store-KnowledgeEdit", "ویرایش منبع"], ["Store-Settings", "تنظیمات"], ["Store-Permissions", "مجوزها"], ["Store-Report", "گزارش"], ["Store-FixInventory?modal=SW1-CloseDiscrepancy", "W1 بستن مغایرت"], ["Store-Settings?modal=SW2-Threshold", "W2 تأیید آستانه"], ["Store-Permissions?modal=SW3-Grant", "W3 اعطای مجوز"], ["Store-ProductEdit?modal=SW4-Leave", "W4 ترک صفحه"], ["Denied-Role", "دسترسی رد شد — نقش"], ["Denied-Page", "دسترسی رد شد — صفحه"]]]},area="customer",dev="m",cur=null,hist=[];var SIM="normal",HL=false;
var stage=document.getElementById("stage"),nav=document.getElementById("nav"),BK=document.getElementById("back"),SS=document.getElementById("sim");
function simSync(){SS.value=SIM;SS.classList.toggle("on",SIM!=="normal")}
SS.addEventListener("change",function(){SIM=SS.value;simSync()});
function frame(){var mobile=area==="customer"&&dev==="m";stage.innerHTML=mobile?'<div class="phone"><iframe id="f" title="صفحه"></iframe></div>':'<div class="desk" id="dk"><iframe id="f" title="صفحه"></iframe></div>';fit()}
function fit(){var d=document.getElementById("dk");if(!d)return;var s=Math.min((stage.clientWidth-40)/1440,(stage.clientHeight-40)/900,1);d.style.transform="scale("+s+")";d.style.margin=(-(900*(1-s))/2)+"px "+(-(1440*(1-s))/2)+"px"}
var P={modal:null,q:"",cn:null,hist:[],src:function(n){var e=document.getElementById("s-"+n);return e?e.textContent.replace(/<\\\/script/g,"<\/script"):""},
load:function(n,q){q=q||"";P.q=q;var mm=/modal=([^&]+)/.exec(q);P.modal=mm?mm[1]:null;var f=document.getElementById("f");f.removeAttribute("src");f.srcdoc=P.src(n)},
go:function(n){P.hist.push([P.cn,P.q]);P.cn=n;P.load(n)},back:function(){var h=P.hist.pop();if(h){P.cn=h[0];P.load(h[0],h[1])}}};
function open(n){var p=n.split("?");P.hist=[];P.cn=p[0];P.load(p[0],p[1]?"?"+p[1]:"")}
function go(n,push){if(push!==false){hist.push(n)}BK.disabled=hist.length<2;open(n);mark(n)}
function mark(n){var hit=nav.querySelector('button[data-n="'+n+'"]');if(!hit)return;cur=n;nav.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-current",b===hit)})}
function setArea(a){area=a;hist=[];SIM="normal";simSync();document.querySelectorAll("[data-a]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.a===a)});document.getElementById("dev").hidden=a!=="customer";document.getElementById("simw").hidden=a!=="customer";
var g=G[a];nav.innerHTML="<h2>"+g[1]+"</h2>"+g[2].map(function(s){return s[0]==="#"?"<h3>"+s[1]+"</h3>":'<button data-n="'+s[0]+'">'+s[1]+"</button>"}).join("")+(a==="customer"?'<p class="note">در گفت‌وگو آزادانه بنویسید یا گزینه‌ها را بزنید. دستیار نمایشی به حدود ۵۰ پرسش رایج (ارسال، سفارش، مرجوعی، پرداخت، تخفیف، محصول) پاسخ می‌دهد و پرسش ناشناخته را به پشتیبان می‌سپارد. سفارش‌های نمونه: ۱۲۳۴ و ۵۵۱. Enter در دسکتاپ پیام را می‌فرستد.</p>':'');
nav.querySelectorAll("button").forEach(function(b){tap(b,function(){go(b.dataset.n)})});frame();var first=g[2].filter(function(s){return s[0]!=="#"})[0][0];go(first)}
document.querySelectorAll("[data-a]").forEach(function(b){tap(b,function(){setArea(b.dataset.a)})});
document.querySelectorAll("[data-d]").forEach(function(b){tap(b,function(){dev=b.dataset.d;document.querySelectorAll("[data-d]").forEach(function(x){x.setAttribute("aria-pressed",x===b)});frame();open(hist[hist.length-1])})});
tap(BK,function(){if(hist.length<2)return;hist.pop();go(hist[hist.length-1],false)});
tap(document.getElementById("restart"),function(){var n=cur||hist[0];hist=[];SIM="normal";simSync();go(n)});
tap(document.getElementById("hl"),function(){HL=!HL;this&&0;document.getElementById("hl").setAttribute("aria-pressed",HL);try{document.getElementById("f").contentDocument.documentElement.classList.toggle("hl",HL)}catch(e){}});
addEventListener("message",function(e){if(!(e.data&&e.data.proto==="screen"))return;var n=e.data.name;var top=hist[hist.length-1]||"";if(n!=="Chat-Live"&&top.split("?")[0]!==n){hist.push(n);BK.disabled=hist.length<2}mark(n);try{if(HL)document.getElementById("f").contentDocument.documentElement.classList.add("hl")}catch(err){}});
addEventListener("resize",fit);
addEventListener("DOMContentLoaded",function(){setArea("customer")});
</script>

<script type="text/html" id="s-Bots-Sample">
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پنل ادمین — نمونه بازبینی</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#142624;background:#f7faf9}
a{color:#0f766e}a:hover{color:#115e59}
::selection{background:#e7f4f1;color:#0b3b38}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
.tab{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:#142624;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:#e7f4f1;color:#0b3b38;border-color:#0f766e}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s3{background:#fdf1dc;color:#8a4b06}.s4{background:#0b3b38;color:#fff}.s5{background:#e8f5ec;color:#166534}.s1{background:#e7f4f1;color:#0b3b38}
table{border-collapse:separate;border-spacing:0;width:100%}
th{text-align:start;font-weight:500;font-size:14px;color:#4f6260;background:#eef3f2;padding:8px 16px;border-bottom:1px solid #d3dcda;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #d3dcda;font-size:14px;line-height:24px;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#f7faf9}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:#0f766e;color:#fff}.btn-p:hover{background:#115e59}
.btn-s{background:#e7f4f1;color:#0b3b38}
.btn-o{background:#ffffff;color:#142624;border-color:#7d8e8c}
.btn-g{background:transparent;color:#0f766e}
.nav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;color:#e6f2ef;text-decoration:none;font-size:14px}
.nav:hover{background:#155e58;color:#fff}

.grp{display:flex;flex-direction:column;gap:4px;max-width:72%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:8px 14px;border-radius:16px;font-size:14px;line-height:24px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}

.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px}
.who-h{color:#0b3b38;font-weight:600}

.nav[aria-current="page"]{background:#155e58;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 #99e2d6}


/*polish*/
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#e6ecea;border-radius:999px;margin:6px 0}
::-webkit-scrollbar-thumb{background:#0f766e;border-radius:999px;min-height:28px}
::-webkit-scrollbar-thumb:hover{background:#115e59}
::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none;width:0;height:0;background:transparent}
textarea::-webkit-scrollbar{width:14px}
textarea::-webkit-scrollbar-track{margin:8px 0;border-left:8px solid transparent;background-clip:padding-box}
textarea::-webkit-scrollbar-thumb{border-left:8px solid transparent;background-clip:padding-box;border-radius:999px}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#0f766e #e6ecea}}

.btn svg,.chip svg{display:block}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px}

.store-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ec9a55;color:#fff;font-size:18px;font-weight:700}
/*endpolishB*/
/*polish5*/
.cause{display:block;margin-top:4px;font-size:13px;line-height:20px;color:#4f6260}
tr.is-new{background:#f3faf8}
tr.is-new>td:first-child{box-shadow:inset -3px 0 0 #0f766e}

.own0{color:#7d8e8c}
.own{display:inline-flex;align-items:center;gap:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#e7f4f1;color:#0b3b38;font-size:12px;font-weight:700}

.legend details[open]>div{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:6;width:400px;padding:14px 16px;background:#fff;border:1px solid #d3dcda;border-radius:12px;box-shadow:0 8px 24px rgba(11,59,56,.12);display:grid;gap:10px;color:#142624}

var cands=[].slice.call(document.querySelectorAll("button,a,label.sw,.sw,.nav,.chip,.tab,.lnk"));

 cands.forEach(function(el){var tx=(el.textContent||"").replace(/\s+/g," ").trim();if(tx===k||tx.indexOf(k)===0&&tx.length<k.length+6)bind(el,t)});
});

document.addEventListener("click",function(e){var t=e.target;if(t.closest("[data-hot],[data-live],#pmodal,details,input,textarea,select,label"))return;var el=t.closest("button,a,[role=tab]");if(!el)return;e.preventDefault();e.stopPropagation();toast("این بخش در نسخه نمایشی فعال نیست")},true);
if(false){var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));function applyF(){var tb=document.querySelector("tbody");if(!tb)return;var rows=[].slice.call(tb.querySelectorAll("tr:not(.empty)"));var tab=document.querySelector('[role=tab][aria-selected=true]');var tl=tab?tab.textContent.replace(/\(.*\)/,"").trim():"همه";var sels=[].slice.call(document.querySelectorAll("main select"));var inp=document.querySelector("main input[placeholder]");var q=inp?inp.value.trim():"";var shown=0;

try{if(parent.HL)document.documentElement.classList.add("hl")}catch(e){}

/*polish*/
::-webkit-scrollbar{width:6px;height:6px}

.own0{color:#7d8e8c}

.tab{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:#142624;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:#e7f4f1;color:#0b3b38;border-color:#0f766e}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s3{background:#fdf1dc;color:#8a4b06}.s4{background:#0b3b38;color:#fff}.s5{background:#e8f5ec;color:#166534}.s1{background:#e7f4f1;color:#0b3b38}
table{border-collapse:separate;border-spacing:0;width:100%}
th{text-align:start;font-weight:500;font-size:14px;color:#4f6260;background:#eef3f2;padding:8px 16px;border-bottom:1px solid #d3dcda;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #d3dcda;font-size:14px;line-height:24px;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#f7faf9}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:#0f766e;color:#fff}.btn-p:hover{background:#115e59}
.btn-s{background:#e7f4f1;color:#0b3b38}
.btn-o{background:#ffffff;color:#142624;border-color:#7d8e8c}
.btn-g{background:transparent;color:#0f766e}
.nav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;color:#e6f2ef;text-decoration:none;font-size:14px}
.nav:hover{background:#155e58;color:#fff}

.grp{display:flex;flex-direction:column;gap:4px;max-width:72%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:8px 14px;border-radius:16px;font-size:14px;line-height:24px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}
.them .bub.tail{border-end-start-radius:6px}
.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px}
.who-h{color:#0b3b38;font-weight:600}
.src{display:block;margin-top:4px;font-size:12px;line-height:18px;color:#4f6260}
.nav[aria-current="page"]{background:#155e58;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 #99e2d6}
.rail a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#142624;text-decoration:none;font-size:14px}
.rail a:hover{background:#eef3f2}
.rail a[aria-current="page"]{background:#e7f4f1;color:#0b3b38;font-weight:600}
.cnt{margin-inline-start:auto;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#fdf1dc;color:#8a4b06;font-size:12px;line-height:22px;text-align:center;font-weight:600}
.card{background:#ffffff;border:1px solid #d3dcda;border-radius:14px}
.lbl{font-size:14px;font-weight:500;line-height:20px}
.help{font-size:12px;line-height:20px;color:#4f6260}
.inp{box-sizing:border-box;min-height:40px;padding:0 12px;border:1px solid #7d8e8c;border-radius:10px;font-family:inherit;font-size:14px;color:#142624;background:#ffffff;width:100%}
textarea.inp{padding:8px 12px;line-height:24px;resize:vertical}
.tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:12px;line-height:22px;font-weight:500;white-space:nowrap}
.t-warn{background:#fdf1dc;color:#8a4b06}.t-dang{background:#fdecea;color:#b42318}.t-neu{background:#edf1f0;color:#3f4e4c}.t-info{background:#e8f0fb;color:#1d4f91}.t-ok{background:#e8f5ec;color:#166534}
.num{font-variant-numeric:tabular-nums}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.sw i{width:36px;height:20px;border-radius:999px;background:#7d8e8c;position:relative;display:inline-block}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.on i{background:#0f766e}.sw.on i::after{inset-inline-start:18px}
.mrow{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid #d3dcda;text-decoration:none;color:#142624}
.mrow:last-child{border-bottom:0}
h1{margin:0;font-size:28px;line-height:40px;font-weight:700}
.m h1{font-size:22px;line-height:34px}
h2{margin:0;font-size:18px;line-height:28px;font-weight:600}

/*polish2*/
aside.rail{background:#0b3b38!important;border-inline-end-color:#0b3b38!important;color:#e6f2ef}
aside.rail>div{border-color:rgba(230,242,239,.14)!important}
aside.rail .help{color:#9cc9c1}
aside.rail a{color:#e6f2ef}
aside.rail a:hover{background:#155e58}
aside.rail a[aria-current="page"]{background:#155e58;color:#fff;box-shadow:inset -3px 0 0 #99e2d6}
aside.rail>div:last-child a{color:#99e2d6!important}
aside.rail .brand-mark{background:linear-gradient(135deg,#14b8a6 0%,#99e2d6 100%)}

/*polish*/
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#e6ecea;border-radius:999px;margin:6px 0}
::-webkit-scrollbar-thumb{background:#0f766e;border-radius:999px;min-height:28px}
::-webkit-scrollbar-thumb:hover{background:#115e59}
::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none;width:0;height:0;background:transparent}
textarea::-webkit-scrollbar{width:14px}
textarea::-webkit-scrollbar-track{margin:8px 0;border-left:8px solid transparent;background-clip:padding-box}
textarea::-webkit-scrollbar-thumb{border-left:8px solid transparent;background-clip:padding-box;border-radius:999px}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#0f766e #e6ecea}}
svg{flex:none}
.btn svg,.chip svg{display:block}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.brand-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#14b8a6;color:#fff;font-weight:700}
.store-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ec9a55;color:#fff;font-size:18px;font-weight:700}
/*endpolishB*/
/*polish4*/
.wait{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-weight:600}
.wait.w1{background:#fdf1dc;color:#8a4b06}
.wait.w2{background:#fdecea;color:#b42318}
td span[style*="font-size:12px"]{font-size:13px!important}
.unread{display:inline-flex;align-items:center;gap:6px;margin-inline-start:8px;color:#0f766e;font-weight:600;font-size:13px}
.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:#0f766e}
section[aria-label="تاریخچه گفت‌وگو"]{height:calc(100vh - 300px);min-height:520px}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child{flex:1;min-height:0!important;overflow:auto;justify-content:flex-start!important}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child>:first-child{margin-top:auto}
details.more{position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>div{position:absolute;inset-inline-start:0;top:calc(100% + 4px);z-index:5;min-width:200px;padding:6px;background:#fff;border:1px solid #d3dcda;border-radius:12px;box-shadow:0 8px 24px rgba(11,59,56,.12)}
details.more>div .btn{width:100%;justify-content:flex-start;border:0}
.setup{display:grid;gap:12px;padding:16px 20px}
.setup ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 24px}
.setup li{display:flex;align-items:center;gap:8px;font-size:14px;line-height:22px}
.setup li.ok{color:#166534}
.setup li.todo{color:#8a4b06;font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:grid;gap:2px;padding:12px 14px;border:1px solid #7d8e8c;border-radius:12px;background:#fff;cursor:pointer}
.choice label.on{border:2px solid #0f766e;background:#e7f4f1;padding:11px 13px}
.choice b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.choice span{font-size:13px;line-height:20px;color:#4f6260}
html{scrollbar-width:none}
html::-webkit-scrollbar{width:0!important;height:0!important;display:none}
body>div>header:first-child{position:sticky;top:0;z-index:30}
aside.rail{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
aside.rail::-webkit-scrollbar{width:0;display:none}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child{border-left:8px solid #f7faf9}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child::-webkit-scrollbar-track{margin:12px 0}
/*endpolish4*/
/*polish5*/
.cause{display:block;margin-top:4px;font-size:13px;line-height:20px;color:#4f6260}
tr.is-new{background:#f3faf8}
tr.is-new>td:first-child{box-shadow:inset -3px 0 0 #0f766e}
tr.late{background:#fff8eb!important}
tr.late>td:first-child{box-shadow:inset -3px 0 0 #d97706!important}
tr.late.w2{background:#fff4f2!important}
tr.late.w2>td:first-child{box-shadow:inset -3px 0 0 #b42318!important}
.alert{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:1px 8px;border-radius:6px;background:#fdf1dc;color:#8a4b06;font-size:12px;line-height:20px;font-weight:600}
tr.w2 .alert{background:#fdecea;color:#b42318}
.own0{color:#7d8e8c}
.own{display:inline-flex;align-items:center;gap:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#e7f4f1;color:#0b3b38;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;line-height:20px;color:#4f6260;margin-top:-8px}
.legend .wait{font-weight:500}
.legend details{margin-inline-start:auto;position:relative}
.legend summary{cursor:pointer;color:#0f766e;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:12px}
.legend details[open]>div{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:6;width:400px;padding:14px 16px;background:#fff;border:1px solid #d3dcda;border-radius:12px;box-shadow:0 8px 24px rgba(11,59,56,.12);display:grid;gap:10px;color:#142624}
.legend dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.legend dd{margin:0;color:#4f6260}
.rv{font-variant-numeric:tabular-nums;white-space:nowrap}
.rv.done{color:#166534;font-weight:600}
.rv.none{color:#7d8e8c}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#e7f4f1;color:#0b3b38;font-size:14px;line-height:22px}
/*endpolish5*/
