<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>صفحه گفت‌وگو — رفع ابهام</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#142624;background:#f7faf9}
a{color:#0f766e}a:hover{color:#115e59}
::selection{background:#e7f4f1;color:#0b3b38}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #0d9488;outline-offset:2px}

.grp{display:flex;flex-direction:column;gap:4px;max-width:85%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:10px 14px;border-radius:18px;font-size:16px;line-height:26px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}
.them .bub.tail{border-end-start-radius:6px}
.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px;display:flex;align-items:center;gap:4px}
.who-h{color:#0b3b38;font-weight:600}
.qr{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:4px}
.qr-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qr-lab{font-size:12px;line-height:18px;color:#4f6260;min-width:28px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #d3dcda;background:#ffffff;color:#142624;font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{border-color:#0f766e;color:#0f766e}
.chip.on{background:#e7f4f1;border-color:#e7f4f1;color:#0b3b38;display:inline-flex;align-items:center;gap:6px;cursor:default}
.chip.cta{background:#0f766e;border-color:#0f766e;color:#fff;display:inline-flex;align-items:center;gap:8px}
.day{align-self:center;font-size:12px;line-height:18px;color:#4f6260;padding:2px 10px;border-radius:999px;background:#eef3f2}
.sys{align-self:center;font-size:12px;line-height:18px;color:#4f6260;display:flex;align-items:center;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<div style="width:100%;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:#f7faf9;overflow:hidden">
<header style="display:flex;align-items:center;gap:16px;height:64px;box-sizing:border-box;padding:0 16px;background:#ffffff;border-bottom:1px solid #d3dcda">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<div style="font-size:16px;line-height:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">فروشگاه نمایشی</div>
<div style="font-size:12px;line-height:16px;color:#4f6260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">دستیار پشتیبانی · نسخه نمایشی</div>
</div>
<button style="flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:0;background:#e7f4f1;color:#0b3b38;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>گفت‌وگو با پشتیبان</button>
</header>

<main style="flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:20px;padding:20px 16px">
<div class="day">امروز</div><div class="grp me"><div class="bub tail">سلام، مانتو الف رو دارید؟</div><span class="meta">۱۰:۳۱</span></div><div class="grp them"><div class="bub tail">این مانتو در سایزهای S، M، L و رنگ‌های مشکی و کرم هست. کدام را می‌خواهید؟</div><div class="qr"><div class="qr-row" role="group" aria-label="سایز"><span class="qr-lab">سایز</span><button class="chip">S</button><button class="chip">M</button><button class="chip">L</button></div><div class="qr-row" role="group" aria-label="رنگ"><span class="qr-lab">رنگ</span><button class="chip">مشکی</button><button class="chip">کرم</button></div></div><span class="meta">دستیار · ۱۰:۳۱</span></div>
</main>
<footer style="padding:10px 16px 24px;background:#ffffff;border-top:1px solid #d3dcda">
<div style="display:flex;gap:8px;align-items:center">
<label style="flex:1;display:flex"><span class="sr">پیام</span>
<textarea rows="1" placeholder="پیامتان را بنویسید…" style="flex:1;resize:none;height:44px;box-sizing:border-box;padding:9px 16px;border:1px solid #7d8e8c;border-radius:22px;font-family:inherit;font-size:16px;line-height:24px;color:#142624;background:#ffffff"></textarea></label>
<button aria-label="ارسال" disabled style="flex:none;width:44px;height:44px;border-radius:999px;border:0;background:#eef3f2;color:#4f6260;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="m11 6-6 6 6 6"/></svg></button>
</div>
</footer>
</div>
<style>[data-hot]{cursor:pointer}.hl [data-hot]{outline:2px solid #f2a33a!important;outline-offset:2px;border-radius:8px;transition:outline-color .2s}</style>
<script>
(function(){var RULES=[["گفت‌وگو با پشتیبان", "Chat-Registering"], ["S", "Chat-Typing"], ["M", "Chat-Typing"], ["L", "Chat-Typing"], ["مشکی", "Chat-Typing"], ["کرم", "Chat-Typing"]],AUTO=null;
function go(t){if(t==="back"){history.back();return}location.href=t+".html"}
function bind(el,t){if(!el||el.dataset.hot)return;el.dataset.hot=t;el.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();go(t)})}
var cands=[].slice.call(document.querySelectorAll("button,a,label.sw,.sw,.nav,.chip,.tab,.lnk"));
RULES.forEach(function(r){var k=r[0],t=r[1];
 if(k==="@send"){bind(document.querySelector('button[aria-label="ارسال"]'),t);return}
 if(k==="@composer"){bind(document.querySelector("textarea"),t);return}
 if(k==="@main"){bind(document.querySelector("main"),t);return}
 if(k==="@sw"){bind(document.querySelectorAll(".sw")[5]||document.querySelector(".sw"),t);return}
 var m=/^@row(\d)$/.exec(k);if(m){var tr=document.querySelectorAll("tbody tr")[+m[1]-1];if(tr){tr.querySelectorAll("a").forEach(function(a){bind(a,t)});bind(tr,t)}return}
 cands.forEach(function(el){var tx=(el.textContent||"").replace(/\s+/g," ").trim();if(tx===k||tx.indexOf(k)===0&&tx.length<k.length+6)bind(el,t)});
});
document.querySelectorAll('a[href$=".dc.html"]').forEach(function(a){var t=a.getAttribute("href").replace(".dc.html","");bind(a,t)});
document.addEventListener("click",function(e){if(e.target.closest("[data-hot]"))return;document.documentElement.classList.add("hl");setTimeout(function(){document.documentElement.classList.remove("hl")},700)});
if(AUTO)setTimeout(function(){go(AUTO[0])},AUTO[1]);
try{parent.postMessage({proto:"screen",name:location.pathname.split("/").pop().replace(".html","")},"*")}catch(e){}
})();
</script>
</body>
</html>
