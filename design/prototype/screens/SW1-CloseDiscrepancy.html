<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>بستن مغایرت بدون اصلاح</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#142624;background:#f7faf9}
a{color:#0f766e}a:hover{color:#115e59}
::selection{background:#e7f4f1;color:#0b3b38}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
.tab{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:#142624;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:#e7f4f1;color:#0b3b38;border-color:#0f766e}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s3{background:#fdf1dc;color:#8a4b06}.s4{background:#0b3b38;color:#fff}.s5{background:#e8f5ec;color:#166534}.s1{background:#e7f4f1;color:#0b3b38}
table{border-collapse:separate;border-spacing:0;width:100%}
th{text-align:start;font-weight:500;font-size:14px;color:#4f6260;background:#eef3f2;padding:8px 16px;border-bottom:1px solid #d3dcda;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #d3dcda;font-size:14px;line-height:24px;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#f7faf9}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:#0f766e;color:#fff}.btn-p:hover{background:#115e59}
.btn-s{background:#e7f4f1;color:#0b3b38}
.btn-o{background:#ffffff;color:#142624;border-color:#7d8e8c}
.btn-g{background:transparent;color:#0f766e}
.nav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;color:#e6f2ef;text-decoration:none;font-size:14px}
.nav:hover{background:#155e58;color:#fff}

.grp{display:flex;flex-direction:column;gap:4px;max-width:72%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:8px 14px;border-radius:16px;font-size:14px;line-height:24px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}
.them .bub.tail{border-end-start-radius:6px}
.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px}
.who-h{color:#0b3b38;font-weight:600}
.src{display:block;margin-top:4px;font-size:12px;line-height:18px;color:#4f6260}
.nav[aria-current="page"]{background:#155e58;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 #99e2d6}
</style>
<div style="width:520px;height:380px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:rgba(11,59,56,0.32);padding:24px">
<div role="dialog" aria-modal="true" aria-labelledby="t" style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:24px;background:#ffffff;border-radius:14px;box-shadow:0 12px 32px rgba(11,59,56,0.16)">
<h2 id="t" style="margin:0;font-size:18px;line-height:28px;font-weight:600">بستن مغایرت بدون اصلاح</h2><label style="display:grid;gap:6px;font-size:14px;font-weight:500">چرا این مورد بدون اصلاح بسته می‌شود؟<textarea rows="3" placeholder="مثلاً این گونه دیگر فروخته نمی‌شود" style="resize:none;box-sizing:border-box;padding:8px 12px;border:1px solid #7d8e8c;border-radius:10px;font-family:inherit;font-size:14px;line-height:24px;font-weight:400"></textarea></label><p style="margin:0;font-size:12px;line-height:20px;color:#4f6260">مانتو ب · سرمه‌ای · L — قدیمی شده</p>
<div style="display:flex;gap:8px"><button class="btn btn-p">بستن مغایرت</button><button class="btn btn-o">انصراف</button></div></div></div>
<style>[data-hot]{cursor:pointer}.hl [data-hot]{outline:2px solid #f2a33a!important;outline-offset:2px;border-radius:8px;transition:outline-color .2s}</style>
<script>
(function(){var RULES=[["بستن مغایرت", "Store-Discrepancies"], ["انصراف", "back"]],AUTO=null;
function go(t){if(t==="back"){history.back();return}location.href=t+".html"}
function bind(el,t){if(!el||el.dataset.hot)return;el.dataset.hot=t;el.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();go(t)})}
var cands=[].slice.call(document.querySelectorAll("button,a,label.sw,.sw,.nav,.chip,.tab,.lnk"));
RULES.forEach(function(r){var k=r[0],t=r[1];
 if(k==="@send"){bind(document.querySelector('button[aria-label="ارسال"]'),t);return}
 if(k==="@composer"){bind(document.querySelector("textarea"),t);return}
 if(k==="@main"){bind(document.querySelector("main"),t);return}
 if(k==="@sw"){bind(document.querySelectorAll(".sw")[5]||document.querySelector(".sw"),t);return}
 var m=/^@row(\d)$/.exec(k);if(m){var tr=document.querySelectorAll("tbody tr")[+m[1]-1];if(tr){tr.querySelectorAll("a").forEach(function(a){bind(a,t)});bind(tr,t)}return}
 cands.forEach(function(el){var tx=(el.textContent||"").replace(/\s+/g," ").trim();if(tx===k||tx.indexOf(k)===0&&tx.length<k.length+6)bind(el,t)});
});
document.querySelectorAll('a[href$=".dc.html"]').forEach(function(a){var t=a.getAttribute("href").replace(".dc.html","");bind(a,t)});
document.addEventListener("click",function(e){if(e.target.closest("[data-hot]"))return;document.documentElement.classList.add("hl");setTimeout(function(){document.documentElement.classList.remove("hl")},700)});
if(AUTO)setTimeout(function(){go(AUTO[0])},AUTO[1]);
try{parent.postMessage({proto:"screen",name:location.pathname.split("/").pop().replace(".html","")},"*")}catch(e){}
})();
</script>
</body>
</html>
