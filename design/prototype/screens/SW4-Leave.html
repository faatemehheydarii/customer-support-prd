<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ترک صفحه</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#142624;background:#f7faf9}
a{color:#0f766e}a:hover{color:#115e59}
::selection{background:#e7f4f1;color:#0b3b38}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
.tab{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:#142624;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:#e7f4f1;color:#0b3b38;border-color:#0f766e}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s3{background:#fdf1dc;color:#8a4b06}.s4{background:#0b3b38;color:#fff}.s5{background:#e8f5ec;color:#166534}.s1{background:#e7f4f1;color:#0b3b38}
table{border-collapse:separate;border-spacing:0;width:100%}
th{text-align:start;font-weight:500;font-size:14px;color:#4f6260;background:#eef3f2;padding:8px 16px;border-bottom:1px solid #d3dcda;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #d3dcda;font-size:14px;line-height:24px;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#f7faf9}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:#0f766e;color:#fff}.btn-p:hover{background:#115e59}
.btn-s{background:#e7f4f1;color:#0b3b38}
.btn-o{background:#ffffff;color:#142624;border-color:#7d8e8c}
.btn-g{background:transparent;color:#0f766e}
.nav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;color:#e6f2ef;text-decoration:none;font-size:14px}
.nav:hover{background:#155e58;color:#fff}

.grp{display:flex;flex-direction:column;gap:4px;max-width:72%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:8px 14px;border-radius:16px;font-size:14px;line-height:24px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}
.them .bub.tail{border-end-start-radius:6px}
.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px}
.who-h{color:#0b3b38;font-weight:600}
.src{display:block;margin-top:4px;font-size:12px;line-height:18px;color:#4f6260}
.nav[aria-current="page"]{background:#155e58;color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 #99e2d6}


/*polish*/
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#e6ecea;border-radius:999px;margin:6px 0}
::-webkit-scrollbar-thumb{background:#0f766e;border-radius:999px;min-height:28px}
::-webkit-scrollbar-thumb:hover{background:#115e59}
::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none;width:0;height:0;background:transparent}
textarea::-webkit-scrollbar{width:14px}
textarea::-webkit-scrollbar-track{margin:8px 0;border-left:8px solid transparent;background-clip:padding-box}
textarea::-webkit-scrollbar-thumb{border-left:8px solid transparent;background-clip:padding-box;border-radius:999px}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#0f766e #e6ecea}}
svg{flex:none}
.btn svg,.chip svg{display:block}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.brand-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#14b8a6;color:#fff;font-weight:700}
.store-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#ec9a55;color:#fff;font-size:18px;font-weight:700}
/*endpolishB*/
/*polish4*/
.wait{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-weight:600}
.wait.w1{background:#fdf1dc;color:#8a4b06}
.wait.w2{background:#fdecea;color:#b42318}
td span[style*="font-size:12px"]{font-size:13px!important}
.unread{display:inline-flex;align-items:center;gap:6px;margin-inline-start:8px;color:#0f766e;font-weight:600;font-size:13px}
.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:#0f766e}
section[aria-label="تاریخچه گفت‌وگو"]{height:calc(100vh - 300px);min-height:520px}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child{flex:1;min-height:0!important;overflow:auto;justify-content:flex-start!important}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child>:first-child{margin-top:auto}
details.more{position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>div{position:absolute;inset-inline-start:0;top:calc(100% + 4px);z-index:5;min-width:200px;padding:6px;background:#fff;border:1px solid #d3dcda;border-radius:12px;box-shadow:0 8px 24px rgba(11,59,56,.12)}
details.more>div .btn{width:100%;justify-content:flex-start;border:0}
.setup{display:grid;gap:12px;padding:16px 20px}
.setup ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 24px}
.setup li{display:flex;align-items:center;gap:8px;font-size:14px;line-height:22px}
.setup li.ok{color:#166534}
.setup li.todo{color:#8a4b06;font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:grid;gap:2px;padding:12px 14px;border:1px solid #7d8e8c;border-radius:12px;background:#fff;cursor:pointer}
.choice label.on{border:2px solid #0f766e;background:#e7f4f1;padding:11px 13px}
.choice b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.choice span{font-size:13px;line-height:20px;color:#4f6260}
html{scrollbar-width:none}
html::-webkit-scrollbar{width:0!important;height:0!important;display:none}
body>div>header:first-child{position:sticky;top:0;z-index:30}
aside.rail{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
aside.rail::-webkit-scrollbar{width:0;display:none}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child{border-left:8px solid #f7faf9}
section[aria-label="تاریخچه گفت‌وگو"]>div:first-child::-webkit-scrollbar-track{margin:12px 0}
/*endpolish4*/
/*polish5*/
.cause{display:block;margin-top:4px;font-size:13px;line-height:20px;color:#4f6260}
tr.is-new{background:#f3faf8}
tr.is-new>td:first-child{box-shadow:inset -3px 0 0 #0f766e}
.own0{color:#7d8e8c}
.own{display:inline-flex;align-items:center;gap:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#e7f4f1;color:#0b3b38;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;line-height:20px;color:#4f6260;margin-top:-8px}
.legend .wait{font-weight:500}
.legend details{margin-inline-start:auto;position:relative}
.legend summary{cursor:pointer;color:#0f766e;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:12px}
.legend details[open]>div{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:6;width:400px;padding:14px 16px;background:#fff;border:1px solid #d3dcda;border-radius:12px;box-shadow:0 8px 24px rgba(11,59,56,.12);display:grid;gap:10px;color:#142624}
.legend dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.legend dd{margin:0;color:#4f6260}
.rv{font-variant-numeric:tabular-nums;white-space:nowrap}
.rv.done{color:#166534;font-weight:600}
.rv.none{color:#7d8e8c}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#e7f4f1;color:#0b3b38;font-size:14px;line-height:22px}
/*endpolish5*/
</style>
<div style="width:520px;height:240px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:rgba(11,59,56,0.32);padding:24px">
<div role="dialog" aria-modal="true" aria-labelledby="t" style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:24px;background:#ffffff;border-radius:14px;box-shadow:0 12px 32px rgba(11,59,56,0.16)">
<h2 id="t" style="margin:0;font-size:18px;line-height:28px;font-weight:600">ترک صفحه</h2><p style="margin:0;font-size:14px;line-height:24px">تغییرات ذخیره نشده‌اند. صفحه را ترک می‌کنید؟</p>
<div style="display:flex;gap:8px"><button class="btn btn-p">ماندن</button><button class="btn btn-o">ترک صفحه</button></div></div></div>
<style>@keyframes pf{from{opacity:0}to{opacity:1}}[data-hot]{cursor:pointer}.hl [data-hot],.hl [data-live]{outline:2px solid #f2a33a!important;outline-offset:2px;border-radius:8px;transition:outline-color .2s}</style>
<script>
(function(){var RULES=[["ماندن", "back"], ["ترک صفحه", "Store-Discrepancies"]],AUTO=null;
var MODALS={"W1-Takeover": [["تحویل از دستیار", "Conversation"], ["انصراف", "back"]], "W2-Resolve": [["بستن — حل شد", "Conversation-Closed"], ["انصراف", "back"]], "W3-CloseUnconfirmed": [["بستن بدون تأیید", "Main"], ["انصراف", "back"]], "W4-Stop": [["توقف پاسخ خودکار", "Queue-Stopped"], ["انصراف", "back"]], "W5-Handback": [["واگذاری به دستیار", "Main"], ["انصراف", "back"]], "SW1-CloseDiscrepancy": [["بستن مغایرت", "Store-Discrepancies"], ["انصراف", "back"]], "SW2-Threshold": [["ذخیره", "Store-Settings"], ["انصراف", "back"]], "SW3-Grant": [["اعطای مجوز", "Store-Permissions"], ["انصراف", "back"]], "SW4-Leave": [["ماندن", "back"], ["ترک صفحه", "Store-Discrepancies"]]};
function go(t){if(t==="back"){history.back();return}if(MODALS[t]){openModal(t);return}location.href=t+".html"}
function closeModal(){var o=document.getElementById("pmodal");if(o)o.remove()}
function openModal(t){fetch(t+".html").then(function(r){return r.text()}).then(function(h){var d=new DOMParser().parseFromString(h,"text/html");var dlg=d.querySelector("[role=dialog]");if(!dlg)return;closeModal();
var o=document.createElement("div");o.id="pmodal";o.setAttribute("style","position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(11,59,56,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:pf .16s ease-out");
dlg=document.importNode(dlg,true);dlg.style.maxWidth="480px";dlg.style.width="100%";o.appendChild(dlg);document.body.appendChild(o);
o.addEventListener("click",function(e){if(e.target===o)closeModal()});
var cs=[].slice.call(dlg.querySelectorAll("button"));MODALS[t].forEach(function(r){cs.forEach(function(b){var tx=b.textContent.replace(/\s+/g," ").trim();if(tx===r[0]){b.style.cursor="pointer";b.onclick=function(e){e.stopPropagation();if(r[1]==="back")closeModal();else{closeModal();location.href=r[1]+".html"}}}})});
var f=dlg.querySelector("button:not([disabled])");if(f)f.focus()})}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
function bind(el,t){if(!el||el.dataset.hot)return;el.dataset.hot=t;el.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();go(t)})}
var cands=[].slice.call(document.querySelectorAll("button,a,label.sw,.sw,.nav,.chip,.tab,.lnk"));
RULES.forEach(function(r){var k=r[0],t=r[1];
 if(k==="@send"){bind(document.querySelector('button[aria-label="ارسال"]'),t);return}
 if(k==="@composer"){bind(document.querySelector("textarea"),t);return}
 if(k==="@main"){bind(document.querySelector("main"),t);return}
 if(k==="@ok"){bind(document.querySelector(".choice label"),t);return}
 if(k==="@sw"){bind(document.querySelectorAll(".sw")[5]||document.querySelector(".sw"),t);return}
 var m=/^@row(\d)$/.exec(k);if(m){var tr=document.querySelectorAll("tbody tr")[+m[1]-1];if(tr){tr.querySelectorAll("a").forEach(function(a){bind(a,t)});bind(tr,t)}return}
 cands.forEach(function(el){var tx=(el.textContent||"").replace(/\s+/g," ").trim();if(tx===k||tx.indexOf(k)===0&&tx.length<k.length+6)bind(el,t)});
});
document.querySelectorAll('a[href$=".dc.html"]').forEach(function(a){var t=a.getAttribute("href").replace(".dc.html","");bind(a,t)});
function toast(m){var t=document.getElementById("ptoast");if(!t){t=document.createElement("div");t.id="ptoast";t.setAttribute("role","status");t.setAttribute("style","position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:12px;background:#0b3b38;color:#fff;font-size:14px;line-height:22px;box-shadow:0 8px 24px rgba(11,59,56,.25);transition:opacity .2s");document.body.appendChild(t)}t.textContent=m;t.style.opacity="1";clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity="0"},1800)}
document.addEventListener("click",function(e){var t=e.target;if(t.closest("[data-hot],[data-live],#pmodal,details,input,textarea,select,label"))return;var el=t.closest("button,a,[role=tab]");if(!el)return;e.preventDefault();e.stopPropagation();toast("این بخش در نسخه نمایشی فعال نیست")},true);
if(false){var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));function applyF(){var tb=document.querySelector("tbody");if(!tb)return;var rows=[].slice.call(tb.querySelectorAll("tr:not(.empty)"));var tab=document.querySelector('[role=tab][aria-selected=true]');var tl=tab?tab.textContent.replace(/\(.*\)/,"").trim():"همه";var sels=[].slice.call(document.querySelectorAll("main select"));var inp=document.querySelector("main input[placeholder]");var q=inp?inp.value.trim():"";var shown=0;
rows.forEach(function(tr){var b=tr.querySelector(".badge");var st=b?b.textContent.trim():"";var ok=tl==="همه"||st===tl||(tl==="بسته"&&/بسته|حل‌شده/.test(st));sels.forEach(function(se){var lab=se.closest("label")?se.closest("label").textContent:"";var v=se.value;if(/مسئول/.test(lab)){if(v==="بدون مسئول")ok=ok&&!!tr.querySelector(".own0");if(v==="من")ok=ok&&tr.textContent.indexOf("سارا")>=0}if(/نوع پاسخ/.test(lab)&&v!=="همه")ok=ok&&tr.textContent.indexOf(v)>=0});if(q)ok=ok&&tr.textContent.indexOf(q)>=0;tr.style.display=ok?"":"none";if(ok)shown++});
var em=tb.querySelector("tr.empty");if(!em){em=document.createElement("tr");em.className="empty";em.innerHTML='<td colspan="9" style="text-align:center;padding:32px;color:#4f6260">گفت‌وگویی با این فیلتر نیست.</td>';tb.appendChild(em)}em.style.display=shown?"none":""}
tabs.forEach(function(b){b.dataset.live="1";b.addEventListener("click",function(){tabs.forEach(function(x){x.setAttribute("aria-selected",x===b)});applyF()})});document.querySelectorAll("main select").forEach(function(se){se.addEventListener("change",applyF)});var ii=document.querySelector("main input[placeholder]");if(ii)ii.addEventListener("input",applyF)}
try{if(parent.HL)document.documentElement.classList.add("hl")}catch(e){}
var q=new URLSearchParams(location.search).get("modal");if(q)setTimeout(function(){openModal(q)},150);
if(AUTO)setTimeout(function(){go(AUTO[0])},AUTO[1]);
try{parent.postMessage({proto:"screen",name:location.pathname.split("/").pop().replace(".html","")},"*")}catch(e){}
})();
</script>
</body>
</html>
