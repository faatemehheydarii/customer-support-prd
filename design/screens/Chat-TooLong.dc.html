<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:#142624;background:#f7faf9}
a{color:#0f766e}a:hover{color:#115e59}
::selection{background:#e7f4f1;color:#0b3b38}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
html,body{overflow:hidden}
.grp{display:flex;flex-direction:column;gap:4px;max-width:85%}
.grp.me{align-self:flex-end;align-items:flex-end}
.grp.them{align-self:flex-start;align-items:flex-start}
.bub{padding:10px 14px;border-radius:18px;font-size:16px;line-height:26px}
.me .bub{background:#e7f4f1;color:#0b3b38}
.me .bub.tail{border-end-end-radius:6px}
.them .bub{background:#ffffff;border:1px solid #d3dcda}
.them .bub.tail{border-end-start-radius:6px}
.meta{font-size:12px;line-height:18px;color:#4f6260;padding:0 4px;display:flex;align-items:center;gap:4px}
.who-h{color:#0b3b38;font-weight:600}
.qr{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:4px}
.qr-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qr-lab{font-size:12px;line-height:18px;color:#4f6260;min-width:28px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #d3dcda;background:#ffffff;color:#142624;font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{border-color:#0f766e;color:#0f766e}
.chip.on{background:#e7f4f1;border-color:#e7f4f1;color:#0b3b38;display:inline-flex;align-items:center;gap:6px;cursor:default}
.chip.cta{background:#0f766e;border-color:#0f766e;color:#fff;display:inline-flex;align-items:center;gap:8px}
.day{align-self:center;font-size:12px;line-height:18px;color:#4f6260;padding:2px 10px;border-radius:999px;background:#eef3f2}
.sys{align-self:center;font-size:12px;line-height:18px;color:#4f6260;display:flex;align-items:center;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.typing{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;border-end-start-radius:6px;background:#ffffff;border:1px solid #d3dcda;font-size:14px;line-height:20px;color:#4f6260}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#0f766e;opacity:.35;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.35}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #d3dcda;border-top-color:#0f766e;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.fail{color:#b42318;font-weight:500}
.lnk{border:0;background:none;padding:0 2px;min-height:32px;color:#0f766e;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/*polish*/
*{scrollbar-width:thin;scrollbar-color:#0f766e transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#0f766e;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#115e59}
::-webkit-scrollbar-button{display:none;width:0;height:0}
textarea::-webkit-scrollbar-thumb{background:#7d8e8c}
svg{flex:none}
.btn svg{display:block}
.brand-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#0f766e 0%,#14b8a6 100%);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.store-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f6c26b 0%,#e8894a 100%);color:#fff;font-size:18px;font-weight:700}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#f7faf9;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px;height:64px;box-sizing:border-box;padding:0 16px;background:#ffffff;border-bottom:1px solid #d3dcda">

<span class="store-mark" aria-hidden="true" title="جای لوگوی فروشگاه">ف</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<div style="font-size:16px;line-height:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">فروشگاه نمایشی</div>
<div style="font-size:12px;line-height:16px;color:#4f6260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">نسخه نمایشی</div>
</div>
<button style="flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #0f766e;background:#ffffff;color:#0f766e;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>گفت‌وگو با پشتیبان</button>
</header>

<main style="flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:20px;padding:20px 16px">
<div class="day">امروز</div><div class="grp them"><div class="bub tail">سلام! من دستیار پشتیبانی فروشگاه نمایشی هستم. درباره محصولات، موجودی، ارسال، سفارش یا مرجوعی بپرسید.</div><span class="meta">دستیار · ۱۰:۳۰</span></div>
</main>
<footer style="padding:10px 16px 24px;background:#ffffff;border-top:1px solid #d3dcda">
<div style="display:flex;gap:8px;align-items:flex-end">
<label style="flex:1;display:flex"><span class="sr">پیام</span>
<textarea rows="5" aria-invalid="true" aria-describedby="h12" style="flex:1;resize:none;height:132px;box-sizing:border-box;padding:9px 16px;border:1px solid #b42318;border-radius:20px;font-family:inherit;font-size:16px;line-height:24px;color:#142624;background:#ffffff">سلام. سفارش ۱۲۳۴ رو هفته پیش ثبت کردم و هنوز به دستم نرسیده. توی پیگیری نوشته ارسال شده ولی کد رهگیری کار نمی‌کنه. قبلاً هم یک بار از همین فروشگاه خرید کرده بودم و همه چیز خوب بود، برای همین تعجب کردم. یک مانتو و یک شلوار سفارش دادم، رنگ مانتو سرمه‌ای و سایز L بود و شلوار جین آبی سایز ۳۲. آدرس رو هم دوباره چک کردم درسته. می‌خواستم بدونم دقیقاً کجاست، کی می‌رسه، و اگر گم شده باشه چه کار باید بکنم. ضمناً اگر دیرتر از جمعه برسه دیگه لازمش ندارم چون برای مهمانی می‌خواستم و ممکنه بخوام مرجوعش کنم. شرایط مرجوعی چیه و هزینه ارسال برگشت با کیه؟ اگر بشه هم شماره تماس پیک رو بدید ممنون می‌شم. باز هم ببخشید پیام طولانی شد ولی می‌خواستم همه چیز رو یک‌جا بگم تا مجبور نشید چند بار…</textarea></label>
<button aria-label="ارسال" disabled style="flex:none;width:44px;height:44px;border-radius:999px;border:0;background:#eef3f2;color:#4f6260;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="m11 6-6 6 6 6"/></svg></button>
</div>
<div id="h12" style="display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding:0 4px;font-size:12px;line-height:18px"><span style="color:#b42318">پیامتان طولانی است. لطفاً کوتاه‌ترش کنید یا در چند پیام بفرستید.</span><span class="num" style="color:#b42318;font-weight:600;white-space:nowrap">۱۰۴۲ از ۱۰۰۰</span></div>
</footer>
</div>
