<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--background); overflow: hidden; font-family: var(--font-sans); }
  .cv svg { position: absolute; inset: 0; }
  .deep { fill: var(--sidebar); } .brand { fill: var(--primary); } .tint { fill: var(--secondary); }
  .mint { fill: var(--sidebar-indicator); } .warm { fill: var(--warning-subtle); } .card { fill: var(--card); }
  .lg { rx: var(--radius-lg); } .xl { rx: var(--radius-xl); }
  .cv__text { position: absolute; left: 48px; bottom: 40px; width: 400px; direction: rtl; text-align: right; }
  .cv__name { font-size: 72px; line-height: .95; font-weight: 700; color: var(--foreground); margin: 0; }
  .cv__tag { font-size: 14px; line-height: 22px; color: var(--muted-foreground); margin: 16px 0 0; }
</style>
<div class="cv">
  <!--
    blocks: sidebar (slab 160×288), primary (232×160), secondary (232×112), sidebar-indicator (72×72), warning-subtle (72×72); corners radius-lg / radius-xl
    arrangement: one tall deep slab bleeding off top/bottom at the right edge, satellites stacked to its left — the panel shell (rail + work area)
    pattern: literal motif row — chat bubbles: radius-xl pills with one square corner (radius-sm), the product's own message shape; 6 units in card and mint
    steps & radii: gaps space-2 (8px) and space-4 (16px); radius-lg 14px, radius-xl 20px; bubble heights space-8 (32px)
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <rect class="deep" x="800" y="-20" width="160" height="328"/>
    <rect class="brand lg" x="552" y="24" width="232" height="160"/>
    <rect class="tint lg" x="552" y="200" width="232" height="112"/>
    <rect class="mint xl" x="472" y="112" width="72" height="72"/>
    <rect class="warm lg" x="472" y="200" width="72" height="72"/>
    <!-- bubbles on the brand block: customer side (square end corner) -->
    <rect class="card xl" x="576" y="48" width="144" height="32"/><rect class="card" x="700" y="60" width="20" height="20"/>
    <rect class="card xl" x="612" y="92" width="148" height="32"/><rect class="card" x="612" y="92" width="20" height="20"/>
    <rect class="mint xl" x="576" y="136" width="104" height="32"/><rect class="mint" x="660" y="148" width="20" height="20"/>
    <!-- bubbles on the deep rail -->
    <rect class="mint xl" x="824" y="56" width="112" height="32"/><rect class="mint" x="916" y="68" width="20" height="20"/>
    <rect class="tint xl" x="824" y="104" width="88" height="32"/><rect class="tint" x="824" y="104" width="20" height="20"/>
    <rect class="brand xl" x="824" y="152" width="112" height="32"/><rect class="brand" x="916" y="164" width="20" height="20"/>
  </svg>
  <div class="cv__text">
    <p class="cv__name">دستیار<br>پشتیبانی</p>
    <p class="cv__tag">پاسخ از منبع تأییدشده، صف روشن برای انسان.</p>
  </div>
</div>
